name: 编译 Hi3798MV100 Linux6.6 内核
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取 6.x 分支源码
        uses: actions/checkout@v4
        with:
          ref: linux-6.x

      - name: 安装编译工具
        run: |
          sudo apt update -y
          sudo apt install -y gcc-arm-linux-gnueabihf make bison flex libssl-dev libelf-dev bc u-boot-tools

      - name: 生成 6.x 内核配置
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make mrproper
          
          cat > .config << EOF
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NET=y
          CONFIG_PACKET=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_NETDEVICES=y
          CONFIG_ETHERNET=y
          CONFIG_NET_VENDOR_HISILICON=y
          CONFIG_HI_ETH=y
          CONFIG_PHYLIB=y
          CONFIG_REALTEK_PHY=y
          CONFIG_BLOCK=y
          CONFIG_MMC=y
          CONFIG_MMC_DW=y
          CONFIG_MMC_DW_HI3798=y
          CONFIG_SERIAL_AMBA_PL011=y
          CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
          CONFIG_TTY=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MEMCG=y
          CONFIG_NAMESPACES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SECCOMP=y
          CONFIG_KERNEL_ZSTD=y
          # 关闭所有显示/多媒体
          CONFIG_VIRTUALIZATION=n
          CONFIG_DRM=n
          CONFIG_FB=n
          CONFIG_VIDEO=n
          CONFIG_SOUND=n
          CONFIG_INPUT_KEYBOARD=n
          CONFIG_INPUT_MOUSE=n
          CONFIG_HI_VDEC=n
          CONFIG_HI_GPU=n
          CONFIG_HI_HDMI=n
          EOF

      - name: 编译内核 zImage
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j2 zImage

      - name: 生成刷机专用内核 bin
        run: |
          mkimage -A arm -O linux -T kernel -C none -a 0x40008000 -e 0x40008000 -n "Linux6.6-MV100" -d arch/arm/boot/zImage hi_kernel-mv100-32.bin
          ls -lh hi_kernel-mv100-32.bin

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: hi_kernel-mv100-32.bin
          path: hi_kernel-mv100-32.bin
