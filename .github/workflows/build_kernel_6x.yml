name: Build Hi3798MV100 Linux6.x Kernel bin
on:
  push:
    branches: [ main, linux-6.x ]
  workflow_dispatch:

jobs:
  build-kernel-6x:
    runs-on: ubuntu-22.04 # 如需GCC 13可改为ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ASDHiope/HiSTBLinuxKernel
          fetch-depth: 0

      - name: 安装官方源交叉编译器与构建依赖（零外部下载，100%稳定）
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            make libncurses-dev bison flex libssl-dev libelf-dev \
            bc git wget unzip lz4 zstd cpio kmod u-boot-tools
          # 验证交叉编译器安装成功
          arm-linux-gnueabihf-gcc --version
          echo "/usr/bin" >> $GITHUB_PATH
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export ARCH=arm

      - name: 切换到Linux6.x LTS分支
        run: |
          git checkout linux-6.x

      - name: 生成纯CLI+Docker专用defconfig
        run: |
          make hi3798mv100_defconfig
          
          # 彻底禁用所有多媒体/显示/输入模块（减小内核体积+避免冲突）
          scripts/config --disable CONFIG_HI_VDEC
          scripts/config --disable CONFIG_HI_GPU
          scripts/config --disable CONFIG_HI_HDMI
          scripts/config --disable CONFIG_HI_MEDIA
          scripts/config --disable CONFIG_FB
          scripts/config --disable CONFIG_DRM
          scripts/config --disable CONFIG_VIDEO
          scripts/config --disable CONFIG_INPUT_KEYBOARD
          scripts/config --disable CONFIG_INPUT_MOUSE
          scripts/config --disable CONFIG_SOUND
          scripts/config --disable CONFIG_USB_SUPPORT # 不需要USB可关闭，如需开启删除此行
          
          # 强制启用以太网核心驱动（适配MV100板载RTL8201F PHY）
          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_ETHERNET
          scripts/config --enable CONFIG_HI_ETH
          scripts/config --enable CONFIG_PHYLIB
          scripts/config --enable CONFIG_REALTEK_PHY
          scripts/config --enable CONFIG_MII
          
          # Docker 25+ 6.x内核完整强制依赖（缺一不可）
          scripts/config --enable CONFIG_CGROUPS
          scripts/config --enable CONFIG_CGROUP_FREEZER
          scripts/config --enable CONFIG_CGROUP_PIDS
          scripts/config --enable CONFIG_CGROUP_DEVICE
          scripts/config --enable CONFIG_CGROUP_CPUACCT
          scripts/config --enable CONFIG_MEMCG
          scripts/config --enable CONFIG_MEMCG_SWAP
          scripts/config --enable CONFIG_NAMESPACES
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --enable CONFIG_POSIX_MQUEUE
          scripts/config --enable CONFIG_SECCOMP
          scripts/config --enable CONFIG_CAPABILITIES
          scripts/config --enable CONFIG_BPF_SYSCALL
          scripts/config --enable CONFIG_NETFILTER
          scripts/config --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          scripts/config --enable CONFIG_IP_NF_FILTER
          scripts/config --enable CONFIG_IP_NF_NAT
          
          # 模块支持与内核优化
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_MODULE_UNLOAD
          scripts/config --enable CONFIG_MODVERSIONS
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --enable CONFIG_KERNEL_ZSTD
          scripts/config --disable CONFIG_KERNEL_DEBUG
          
          # 保存最终配置
          make savedefconfig
          cp defconfig arch/arm/configs/hi3798mv100_final_defconfig

      - name: 编译内核并生成刷机专用hi_kernel-mv100-32.bin
        run: |
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export ARCH=arm
          # GitHub Actions 2核CPU并行编译
          make -j2 zImage
          
          # 海思专用mkimage打包（双源备用，优先使用你仓库的原版工具）
          if [ ! -f mkimage ]; then
            echo "尝试从你的仓库下载mkimage..."
            wget --tries=3 --timeout=10 https://github.com/ASDHiope/HiSTBLinuxKernel/raw/linux-4.4.y/tools/mkimage -O mkimage || \
            wget --tries=3 --timeout=10 https://raw.githubusercontent.com/hi3798mv100/tools/main/mkimage -O mkimage
            chmod +x mkimage
          fi
          
          # 固定加载地址0x40008000为Hi3798MV100硬件强制要求，不可修改
          ./mkimage -A arm -O linux -T kernel -C none \
            -a 0x40008000 -e 0x40008000 \
            -n "Linux6.6-MV100-PureCLI" \
            -d arch/arm/boot/zImage hi_kernel-mv100-32.bin
          
          # 验证生成文件
          echo "编译完成！内核文件信息："
          ls -lh hi_kernel-mv100-32.bin
          file hi_kernel-mv100-32.bin

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: hi_kernel-mv100-32-6.6-final
          path: hi_kernel-mv100-32.bin
          retention-days: 180 # 保留半年

      - name: 自动发布到Release（可选）
        if: github.ref == 'refs/heads/linux-6.x'
        uses: softprops/action-gh-release@v2
        with:
          files: hi_kernel-mv100-32.bin
          tag_name: kernel-mv100-6.6-stable-${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
