name: Build Linux 5.x Server for Hi3798MV100

on:
  push:
    branches: [ "main", "master" ]
    paths:
      # ✅ 核心需求：编辑此 yml 文件时自动触发构建
      - '.github/workflows/build-5x-server.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

env:
  KERNEL_VERSION: "5.10"
  ARCH: arm
  CROSS_COMPILE: arm-linux-gnueabihf-
  # ✅ 关键修复：显式指定 ARMv7-A / Cortex-A7 架构
  TARGET_CFLAGS: "-march=armv7-a -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard"
  DTB_NAME: hisilicon/hi3798mv100.dtb

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            bison flex libssl-dev bc kmod cpio \
            device-tree-compiler python3 python3-pip \
            lzop u-boot-tools swig libelf-dev
          
      - name: Verify Toolchain
        run: |
          ${CROSS_COMPILE}gcc --version
          echo "Target CFLAGS: $TARGET_CFLAGS"

      - name: Configure Kernel
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            CFLAGS="${TARGET_CFLAGS}" \
            multi_v7_defconfig

      - name: Compile zImage
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            CFLAGS="${TARGET_CFLAGS}" \
            zImage -j$(nproc)

      - name: Compile Device Tree
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            CFLAGS="${TARGET_CFLAGS}" \
            ${DTB_NAME} -j$(nproc)

      - name: Compile Modules
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            CFLAGS="${TARGET_CFLAGS}" \
            modules -j$(nproc)

      - name: Package Artifacts
        run: |
          mkdir -p output
          cp arch/arm/boot/zImage output/
          cp arch/arm/boot/dts/${DTB_NAME} output/
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            INSTALL_MOD_PATH=output/modules modules_install
          cd output && tar czf ../linux-5x-hi3798mv100.tar.gz .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-5x-hi3798mv100
          path: linux-5x-hi3798mv100.tar.gz
          retention-days: 7
