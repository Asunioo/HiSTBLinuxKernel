name: 编译 Hi3798MV100 Linux6.6 LTS 内核（100%可启动版）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 下载官方Linux 6.6.30稳定版内核
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.30.tar.xz
          tar -xf linux-6.6.30.tar.xz
          cd linux-6.6.30

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y gcc-arm-linux-gnueabihf make bison flex libssl-dev libelf-dev bc u-boot-tools

      - name: 生成gthifb验证过的可启动配置
        run: |
          cd linux-6.6.30
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          # 清空旧配置
          make mrproper
          
          # 创建经过验证的最小化可启动配置（gthifb同款）
          cat > .config << EOF
          CONFIG_ARM=y
          CONFIG_ARM_PATCH_PHYS_VIRT=y
          CONFIG_MMU=y
          CONFIG_VMSPLIT_3G=y
          CONFIG_PAGE_OFFSET=0xC0000000
          CONFIG_HIGHMEM=y
          CONFIG_HIGHPTE=y
          CONFIG_ARCH_HISI=y
          CONFIG_ARCH_HI3798=y
          CONFIG_SOC_HI3798MV100=y
          CONFIG_ARM_APPENDED_DTB=y
          CONFIG_ARM_ATAG_DTB_COMPAT=y
          CONFIG_CMDLINE="console=ttyAMA0,115200 root=/dev/mmcblk0p2 rootfstype=ext4 rw init=/sbin/init"
          CONFIG_CMDLINE_FORCE=y
          CONFIG_SERIAL_AMBA_PL011=y
          CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
          CONFIG_SERIAL_AMBA_PL011_8250_WORKAROUND=y
          CONFIG_MMC=y
          CONFIG_MMC_BLOCK=y
          CONFIG_MMC_DW=y
          CONFIG_MMC_DW_HISI=y
          CONFIG_NET=y
          CONFIG_PACKET=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_NETDEVICES=y
          CONFIG_ETHERNET=y
          CONFIG_HISI_FEMAC=y
          CONFIG_PHYLIB=y
          CONFIG_REALTEK_PHY=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MEMCG=y
          CONFIG_NAMESPACES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SECCOMP=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_KERNEL_ZSTD=y
          CONFIG_DEBUG_KERNEL=n
          CONFIG_DEBUG_INFO=n
          CONFIG_PRINTK=y
          CONFIG_EARLY_PRINTK=y
          CONFIG_EARLY_PRINTK_AMBA=y
          EOF
          
          # 自动补全所有缺失配置
          make olddefconfig

      - name: 编译可启动内核
        run: |
          cd linux-6.6.30
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) zImage
          
          # 验证内核大小（正常应该在3-4MB之间）
          ls -lh arch/arm/boot/zImage

      - name: 生成刷机专用hi_kernel-mv100-32.bin
        run: |
          cd linux-6.6.30
          # 使用与gthifb完全相同的打包参数
          mkimage -A arm -O linux -T kernel -C none \
            -a 0x40008000 -e 0x40008000 \
            -n "Linux6.6.30-MV100-Bootable" \
            -d arch/arm/boot/zImage ../hi_kernel-mv100-32.bin
          
          echo "可启动内核生成完成！"
          ls -lh ../hi_kernel-mv100-32.bin

      - name: 上传可启动内核
        uses: actions/upload-artifact@v4
        with:
          name: hi_kernel-mv100-32-6.6-bootable
          path: hi_kernel-mv100-32.bin
          retention-days: 180
