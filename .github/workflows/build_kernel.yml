name: 编译 荣耀M321 海纳斯兼容版 Linux6.6 LTS 内核
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 下载官方Linux 6.6.30稳定版内核
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.30.tar.xz
          tar -xf linux-6.6.30.tar.xz
          cd linux-6.6.30

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y gcc-arm-linux-gnueabihf make bison flex libssl-dev libelf-dev bc u-boot-tools device-tree-compiler

      - name: 应用荣耀M321+海纳斯专属设备树补丁
        run: |
          cd linux-6.6.30
          
          # 创建Hi3798MV100设备树包含文件（与之前相同）
          cat > arch/arm/boot/dts/hisilicon/hi3798mv100.dtsi << 'EOF'
          #include <dt-bindings/interrupt-controller/arm-gic.h>
          #include <dt-bindings/clock/hi3798cv200-clock.h>
          #include <dt-bindings/gpio/gpio.h>

          / {
              #address-cells = <1>;
              #size-cells = <1>;
              interrupt-parent = <&gic>;

              cpus {
                  #address-cells = <1>;
                  #size-cells = <0>;

                  cpu@0 {
                      compatible = "arm,cortex-a7";
                      device_type = "cpu";
                      reg = <0>;
                  };

                  cpu@1 {
                      compatible = "arm,cortex-a7";
                      device_type = "cpu";
                      reg = <1>;
                  };

                  cpu@2 {
                      compatible = "arm,cortex-a7";
                      device_type = "cpu";
                      reg = <2>;
                  };

                  cpu@3 {
                      compatible = "arm,cortex-a7";
                      device_type = "cpu";
                      reg = <3>;
                  };
              };

              gic: interrupt-controller@f1001000 {
                  compatible = "arm,cortex-a7-gic";
                  #interrupt-cells = <3>;
                  interrupt-controller;
                  reg = <0xf1001000 0x1000>,
                        <0xf1002000 0x1000>;
              };

              timer {
                  compatible = "arm,armv7-timer";
                  interrupts = <GIC_PPI 13 (GIC_CPU_MASK_SIMPLE(4) | IRQ_TYPE_LEVEL_LOW)>,
                               <GIC_PPI 14 (GIC_CPU_MASK_SIMPLE(4) | IRQ_TYPE_LEVEL_LOW)>,
                               <GIC_PPI 11 (GIC_CPU_MASK_SIMPLE(4) | IRQ_TYPE_LEVEL_LOW)>,
                               <GIC_PPI 10 (GIC_CPU_MASK_SIMPLE(4) | IRQ_TYPE_LEVEL_LOW)>;
                  clock-frequency = <24000000>;
              };

              soc {
                  #address-cells = <1>;
                  #size-cells = <1>;
                  compatible = "simple-bus";
                  ranges;

                  uart0: serial@f8b00000 {
                      compatible = "arm,pl011", "arm,primecell";
                      reg = <0xf8b00000 0x1000>;
                      interrupts = <GIC_SPI 4 IRQ_TYPE_LEVEL_HIGH>;
                      clocks = <&crg HI3798CV200_UART0_CLK>;
                      clock-names = "apb_pclk";
                      status = "disabled";
                  };

                  mmc0: mmc@f9830000 {
                      compatible = "hisilicon,hi3798cv200-dw-mshc";
                      reg = <0xf9830000 0x1000>;
                      interrupts = <GIC_SPI 30 IRQ_TYPE_LEVEL_HIGH>;
                      clocks = <&crg HI3798CV200_MMC0_CLK>,
                               <&crg HI3798CV200_MMC0_SAMPLE_CLK>,
                               <&crg HI3798CV200_MMC0_DRV_CLK>;
                      clock-names = "biu", "ciu", "ciu-drive";
                      resets = <&crg 0x108 0>;
                      reset-names = "reset";
                      status = "disabled";
                  };

                  mmc1: mmc@f9831000 {
                      compatible = "hisilicon,hi3798cv200-dw-mshc";
                      reg = <0xf9831000 0x1000>;
                      interrupts = <GIC_SPI 31 IRQ_TYPE_LEVEL_HIGH>;
                      clocks = <&crg HI3798CV200_MMC1_CLK>,
                               <&crg HI3798CV200_MMC1_SAMPLE_CLK>,
                               <&crg HI3798CV200_MMC1_DRV_CLK>;
                      clock-names = "biu", "ciu", "ciu-drive";
                      resets = <&crg 0x108 1>;
                      reset-names = "reset";
                      status = "disabled";
                  };

                  gmac: ethernet@f9840000 {
                      compatible = "hisilicon,hi3798cv200-femac";
                      reg = <0xf9840000 0x1000>;
                      interrupts = <GIC_SPI 32 IRQ_TYPE_LEVEL_HIGH>;
                      clocks = <&crg HI3798CV200_GMAC_CLK>;
                      clock-names = "clk";
                      resets = <&crg 0x10c 0>;
                      reset-names = "mac";
                      status = "disabled";
                  };

                  usb0: ehci@f9880000 {
                      compatible = "generic-ehci";
                      reg = <0xf9880000 0x1000>;
                      interrupts = <GIC_SPI 34 IRQ_TYPE_LEVEL_HIGH>;
                      clocks = <&crg HI3798CV200_USB2_BUS_CLK>;
                      status = "disabled";
                  };

                  usb1: ohci@f9881000 {
                      compatible = "generic-ohci";
                      reg = <0xf9881000 0x1000>;
                      interrupts = <GIC_SPI 35 IRQ_TYPE_LEVEL_HIGH>;
                      clocks = <&crg HI3798CV200_USB2_BUS_CLK>;
                      status = "disabled";
                  };

                  crg: clock-reset-controller@f8a22000 {
                      compatible = "hisilicon,hi3798cv200-crg";
                      reg = <0xf8a22000 0x1000>;
                      #clock-cells = <1>;
                      #reset-cells = <2>;
                  };
              };
          };
          EOF
          
          # 创建荣耀M321+海纳斯专属设备树文件
          cat > arch/arm/boot/dts/hisilicon/honor-m321-hinas.dts << 'EOF'
          cat > arch/arm/boot/dts/hisilicon/honor-m321-hinas.dts << 'EOF'
          /dts-v1/;
          #include "hi3798mv100.dtsi"

          / {
              model = "Honor MediaQ M321 (HiNAS Compatible)";
              compatible = "honor,m321", "hisilicon,hi3798mv100", "hisilicon,hi3798";

              chosen {
                  stdout-path = &uart0;
              };

              memory@40000000 {
                  device_type = "memory";
                  reg = <0x40000000 0x2F000000>; /* 768MB - 16MB Fastboot预留 */
              };
          };

          &uart0 { status = "okay"; };
          &mmc0 { status = "okay"; bus-width = <8>; non-removable; cap-mmc-highspeed; cap-mmc-ddr50; };
          &mmc1 { status = "okay"; bus-width = <4>; cap-sd-highspeed; };
          &gmac { status = "okay"; phy-handle = <&phy0>; phy-mode = "rmii"; phy0: ethernet-phy@0 { reg = <0>; compatible = "realtek,rtl8201f"; }; };
          &usb0 { status = "okay"; };
          &usb1 { status = "okay"; };
          EOF

          # 更新Makefile
          echo "dtb-$(CONFIG_ARCH_HI3798) += honor-m321-hinas.dtb" >> arch/arm/boot/dts/hisilicon/Makefile

      - name: 生成海纳斯兼容的内核配置
        run: |
          cd linux-6.6.30
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          make mrproper
          
          cat > .config << 'EOF'
          CONFIG_ARM=y
          CONFIG_ARM_PATCH_PHYS_VIRT=y
          CONFIG_MMU=y
          CONFIG_VMSPLIT_3G=y
          CONFIG_PAGE_OFFSET=0xC0000000
          CONFIG_HIGHMEM=y
          CONFIG_HIGHPTE=y
          CONFIG_ARCH_HISI=y
          CONFIG_ARCH_HI3798=y
          CONFIG_SOC_HI3798MV100=y

          # 设备树支持
          CONFIG_USE_OF=y
          CONFIG_ARM_APPENDED_DTB=y
          CONFIG_ARM_ATAG_DTB_COMPAT=y
          CONFIG_OF_FLATTREE=y
          CONFIG_OF_EARLY_FLATTREE=y

          # 海纳斯关键修复：禁用内核命令行强制
          CONFIG_CMDLINE="console=ttyAMA0,115200 rootfstype=ext4 rw init=/sbin/init"
          # 必须关闭！否则会覆盖海纳斯bootargs的root=/dev/mmcblk0p9
          CONFIG_CMDLINE_FORCE=n

          # 内存地址
          CONFIG_PHYS_OFFSET=0x40000000

          # 串口
          CONFIG_SERIAL_AMBA_PL011=y
          CONFIG_SERIAL_AMBA_PL011_CONSOLE=y

          # MMC/SD
          CONFIG_MMC=y
          CONFIG_MMC_BLOCK=y
          CONFIG_MMC_DW=y
          CONFIG_MMC_DW_HISI=y

          # 网络
          CONFIG_NET=y
          CONFIG_PACKET=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_NETDEVICES=y
          CONFIG_ETHERNET=y
          CONFIG_HISI_FEMAC=y
          CONFIG_PHYLIB=y
          CONFIG_REALTEK_PHY=y

          # USB
          CONFIG_USB=y
          CONFIG_USB_EHCI_HCD=y
          CONFIG_USB_OHCI_HCD=y
          CONFIG_USB_STORAGE=y

          # 时钟和复位
          CONFIG_COMMON_CLK=y
          CONFIG_COMMON_CLK_HI3798CV200=y
          CONFIG_RESET_CONTROLLER=y
          CONFIG_RESET_HISI=y

          # GPIO
          CONFIG_GPIOLIB=y

          # 文件系统
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_VFAT_FS=y
          CONFIG_OVERLAY_FS=y

          # 系统功能
          CONFIG_CGROUPS=y
          CONFIG_MEMCG=y
          CONFIG_NAMESPACES=y
          CONFIG_SECCOMP=y
          CONFIG_BPF_SYSCALL=y

          # 模块
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y

          # 压缩
          CONFIG_KERNEL_ZSTD=y

          # 调试
          CONFIG_DEBUG_KERNEL=n
          CONFIG_DEBUG_INFO=n
          CONFIG_PRINTK=y
          CONFIG_EARLY_PRINTK=y

          # 禁用不必要功能
          CONFIG_SOUND=n
          CONFIG_VIDEO=n
          CONFIG_FB=n
          CONFIG_DRM=n
          CONFIG_INPUT=n
          EOF
          
          make olddefconfig

      - name: 编译内核和设备树
        run: |
          cd linux-6.6.30
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          make -j$(nproc) zImage dtbs
          
          # 附加设备树
          cat arch/arm/boot/zImage arch/arm/boot/dts/hisilicon/honor-m321-hinas.dtb > arch/arm/boot/zImage-dtb
          
          # 验证大小（必须<16MB）
          ls -lh arch/arm/boot/zImage-dtb

      - name: 生成海纳斯刷机专用内核镜像
        run: |
          cd linux-6.6.30
          
          # 与海纳斯完全相同的打包参数
          mkimage -A arm -O linux -T kernel -C none \
            -a 0x40008000 -e 0x40008000 \
            -n "Linux6.6.30-M321-HiNAS" \
            -d arch/arm/boot/zImage-dtb ../hi_kernel-m321-hinas.bin
          
          echo "海纳斯兼容内核生成完成！"
          ls -lh ../hi_kernel-m321-hinas.bin

      - name: 上传内核镜像
        uses: actions/upload-artifact@v4
        with:
          name: hi_kernel-m321-hinas-6.6
          path: hi_kernel-m321-hinas.bin
          retention-days: 180
